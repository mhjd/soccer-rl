<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Geometric controller paths around the ball</title>
  <desc id="description">Two top-down diagrams show a direct path to the approach point and a detour when the ball blocks that path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d8e5dc"/>
    </marker>
    <marker id="shot-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffd166"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.22"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #edf4ef; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #b7c7bc; }
      .panel-title { font-size: 21px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 600; }
      .small { font-size: 13px; fill: #c7d4cb; }
      .pitch-line { stroke: #dce8df; stroke-width: 2; fill: none; opacity: .72; }
      .path { stroke: #d8e5dc; stroke-width: 5; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
      .guide { stroke: #b8c5bc; stroke-width: 2; fill: none; stroke-dasharray: 8 7; opacity: .65; }
      .shot { stroke: #ffd166; stroke-width: 5; fill: none; marker-end: url(#shot-arrow); stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="28" fill="#111a15"/>
  <text x="52" y="54" class="title">How the geometric controller chooses an approach</text>
  <text x="52" y="82" class="subtitle">Top-down view. It first reaches a point behind the ball, aligns with the goal, then walks through the ball.</text>

  <g transform="translate(42 112)" filter="url(#shadow)">
    <rect width="540" height="362" rx="20" fill="#265d3b"/>
    <rect x="20" y="58" width="500" height="280" rx="6" class="pitch-line"/>
    <line x1="270" y1="58" x2="270" y2="338" class="pitch-line" opacity=".25"/>
    <rect x="492" y="141" width="28" height="112" class="pitch-line"/>
    <text x="28" y="38" class="panel-title">1. Clear path</text>
    <text x="515" y="132" class="small" text-anchor="end">goal</text>

    <circle cx="350" cy="198" r="18" fill="#f5a742" stroke="#fff2d8" stroke-width="4"/>
    <text x="350" y="237" class="label" text-anchor="middle">ball</text>

    <circle cx="250" cy="212" r="8" fill="#61dafb" stroke="#dff8ff" stroke-width="3"/>
    <text x="250" y="253" class="small" text-anchor="middle">approach point</text>
    <text x="250" y="272" class="small" text-anchor="middle">0.75 m behind, 0.08 m lateral</text>

    <g transform="translate(122 286) rotate(-22)">
      <path d="M 20 0 L -15 -14 L -15 14 Z" fill="#e9edf7" stroke="#7585a5" stroke-width="3"/>
    </g>
    <text x="122" y="325" class="label" text-anchor="middle">G1</text>

    <path d="M 139 279 Q 183 244 242 215" class="path"/>
    <path d="M 259 210 Q 300 199 328 198" class="shot"/>
    <path d="M 371 198 L 487 198" class="shot"/>
  </g>

  <g transform="translate(618 112)" filter="url(#shadow)">
    <rect width="540" height="362" rx="20" fill="#265d3b"/>
    <rect x="20" y="58" width="500" height="280" rx="6" class="pitch-line"/>
    <line x1="270" y1="58" x2="270" y2="338" class="pitch-line" opacity=".25"/>
    <rect x="492" y="141" width="28" height="112" class="pitch-line"/>
    <text x="28" y="38" class="panel-title">2. Ball blocks the direct path</text>
    <text x="515" y="132" class="small" text-anchor="end">goal</text>

    <circle cx="350" cy="198" r="18" fill="#f5a742" stroke="#fff2d8" stroke-width="4"/>
    <text x="350" y="237" class="label" text-anchor="middle">ball</text>

    <circle cx="250" cy="212" r="8" fill="#61dafb" stroke="#dff8ff" stroke-width="3"/>
    <text x="250" y="245" class="small" text-anchor="middle">approach point</text>

    <circle cx="350" cy="92" r="8" fill="#c084fc" stroke="#f0ddff" stroke-width="3"/>
    <text x="340" y="78" class="small" text-anchor="end">detour point</text>
    <text x="340" y="96" class="small" text-anchor="end">0.8 m from ball</text>

    <g transform="translate(432 198) rotate(180)">
      <path d="M 20 0 L -15 -14 L -15 14 Z" fill="#e9edf7" stroke="#7585a5" stroke-width="3"/>
    </g>
    <text x="432" y="237" class="label" text-anchor="middle">G1</text>

    <path d="M 414 198 L 270 210" class="guide"/>
    <text x="426" y="176" class="small" text-anchor="end">blocked direct path</text>
    <path d="M 426 181 Q 417 112 360 94" class="path"/>
    <path d="M 342 96 Q 275 122 252 202" class="path"/>
    <path d="M 259 210 Q 300 199 328 198" class="shot"/>
    <path d="M 371 198 L 487 198" class="shot"/>
  </g>

  <g transform="translate(52 504)">
    <line x1="0" y1="0" x2="48" y2="0" class="path"/>
    <text x="68" y="5" class="small">navigation path</text>
    <line x1="235" y1="0" x2="283" y2="0" class="shot"/>
    <text x="303" y="5" class="small">alignment and drive-through</text>
    <text x="1110" y="5" class="small" text-anchor="end">The controller recomputes its targets from the current simulator state.</text>
  </g>
</svg>
